name: Fly Relay Deploy

on:
  push:
    branches: [main, master]
    paths:
      - "server/**"
      - ".github/workflows/fly-relay.yml"
  workflow_dispatch:

concurrency:
  group: fly-relay-deploy
  cancel-in-progress: true

jobs:
  test:
    name: Test relay
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy relay
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
